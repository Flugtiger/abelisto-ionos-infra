apiVersion: apps/v1
kind: Deployment
metadata:
  name: talk-hpb
  labels:
    app: talk-hpb
spec:
  replicas: 1            # HPB (signaling+janus+nats+eturnal) laeuft als ein Pod
  strategy:
    type: Recreate       # hostPorts koennen nicht doppelt belegt werden
  selector:
    matchLabels:
      app: talk-hpb
  template:
    metadata:
      labels:
        app: talk-hpb
    spec:
      # Kein hostNetwork: IONOS belegt Port 8081 auf jedem Node (nginx-proxy fuer
      # den API-Server), den auch der Signaling-Server fest nutzt. Stattdessen
      # hostPorts wie beim Docker-Setup von Nextcloud AIO: 80/443 (Caddy) und
      # 3478 TCP/UDP (TURN). 8081 bleibt pod-intern.
      nodeSelector:
        talk-hpb: "true"   # Label im DCD am Node Pool setzen (ueberlebt Node-Austausch)
      terminationGracePeriodSeconds: 30
      containers:
        - name: talk
          image: ghcr.io/nextcloud-releases/aio-talk:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: talk-hpb-config
            - secretRef:
                name: talk-hpb-secrets
          ports:
            - { name: signaling, containerPort: 8081, protocol: TCP }
            - { name: turn-tcp, containerPort: 3478, hostPort: 3478, protocol: TCP }
            - { name: turn-udp, containerPort: 3478, hostPort: 3478, protocol: UDP }
          readinessProbe:
            httpGet: { path: /api/v1/welcome, port: 8081 }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["/healthcheck.sh"] }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits:   { memory: 2Gi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: conf, mountPath: /conf }
        - name: caddy
          image: caddy:2.8.4-alpine
          env:
            - name: TALK_HOST
              valueFrom: { configMapKeyRef: { name: talk-hpb-config, key: TALK_HOST } }
          ports:
            - { name: http, containerPort: 80, hostPort: 80, protocol: TCP }
            - { name: https, containerPort: 443, hostPort: 443, protocol: TCP }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { memory: 256Mi }
          volumeMounts:
            - { name: caddyfile, mountPath: /etc/caddy }
            - { name: caddy-data, mountPath: /data }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: conf
          emptyDir: {}
        - name: caddyfile
          configMap: { name: talk-hpb-caddyfile }
        - name: caddy-data
          persistentVolumeClaim: { claimName: caddy-data }
