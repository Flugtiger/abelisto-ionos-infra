apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: talk-hpb
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - cronjob-restart.yaml
configMapGenerator:
  - name: talk-hpb-config
    envs: [config.env]
  - name: talk-hpb-caddyfile
    files: [Caddyfile]
secretGenerator:
  - name: talk-hpb-secrets
    envs: [secrets.env]   # wird von generate-secrets.sh erzeugt, NICHT committen
